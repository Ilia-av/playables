<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Unpack &amp; Decorate — Playable</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0b16}
  #f{position:absolute;left:50%;top:50%;border:0;transform-origin:0 0;background:#0d0b16}
</style>
</head>
<body>
<iframe id="f" src="unpack-decorate-ad.html" allow="autoplay; fullscreen" title="Unpack & Decorate playable"></iframe>
<script>
/* Render the playable at a phone-sized design viewport and scale it uniformly,
   so the UI keeps its proportions in small embeds (e.g. Notion). */
var DW=390, MINH=600, MAXH=844, f=document.getElementById('f');
function fit(){
  var W=innerWidth, H=innerHeight;
  var DH=Math.max(MINH, Math.min(MAXH, Math.round(DW*H/W)));
  var s=Math.min(W/DW, H/DH);
  f.style.width=DW+'px'; f.style.height=DH+'px';
  f.style.transform='translate('+(-DW*s/2)+'px,'+(-DH*s/2)+'px) scale('+s+')';
}
fit(); addEventListener('resize',fit); addEventListener('orientationchange',fit);
</script>
</body>
</html>
